name: coverage

# prod-7: test coverage floor. The bar is a regression gate, not a
# quality goal — the baseline at prod-7 was 32% across padhai/, so
# we set --fail-under=30 to allow small refactors without lying about
# the number. Future sprints add tests to push the floor up.
#
# To raise the floor: edit `--cov-fail-under` below AND the
# `MIN_COVERAGE_PCT` constant in pyproject.toml. Always raise both
# together so `make coverage` matches CI.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  coverage:
    name: pytest --cov
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PADHAI_SKIP_DOTENV: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-test.txt
          python -m pip install coverage pytest-cov

      - name: Run pytest with coverage
        run: |
          python -m pytest tests/ \
            --cov=padhai \
            --cov-report=term \
            --cov-report=xml \
            --cov-fail-under=30

      - name: Upload coverage XML artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14
