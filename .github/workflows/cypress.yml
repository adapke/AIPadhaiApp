name: Cypress Tests

on: [push]

# Computed once at the job level so every step / matrix container
# agrees on whether to record. `secrets.X != ''` is the canonical
# guard that's safe to evaluate in `with:` and `if:`.
env:
  HAS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY != '' && 'yes' || 'no' }}

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Runs tests in parallel with matrix strategy https://on.cypress.io/parallelization
    # When CYPRESS_RECORD_KEY is configured, Cypress Cloud splits
    # specs across the two containers. Without it, the second
    # container will just duplicate the first's work — wasteful but
    # not broken; remove the second entry from the matrix if you
    # don't plan to enable Cypress Cloud.
    strategy:
      fail-fast: false # https://github.com/cypress-io/github-action/issues/48
      matrix:
        containers: [1, 2]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------- Backend (FastAPI / uvicorn) ----------
      # AIPadhaiApp's "web server" is Python, not Node. Set up Python
      # first and install runtime deps so uvicorn can import padhai.web.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Defensive: ensure uvicorn + fastapi are present even if
          # requirements.txt drifts.
          pip install fastapi 'pydantic>=2' python-multipart 'uvicorn[standard]'

      - name: Generate ephemeral JWT secret
        run: |
          # padhai.web refuses to start without PADHAI_JWT_SECRET.
          # Generate a one-shot secret per CI run; never reused.
          echo "PADHAI_JWT_SECRET=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')" >> "$GITHUB_ENV"

      # ---------- Cypress: RECORDED variant ----------
      # When CYPRESS_RECORD_KEY is configured, push results + video to
      # Cypress Cloud (project s5k23d), split load across matrix
      # containers, and tag the run by event + branch for filtering.
      - name: Cypress run (recorded + parallel)
        if: env.HAS_RECORD_KEY == 'yes'
        uses: cypress-io/github-action@v7
        with:
          start: python -m uvicorn padhai.web:app --host 0.0.0.0 --port 8000 --log-level warning
          wait-on: 'http://127.0.0.1:8000/healthz'
          wait-on-timeout: 180
          record: true
          parallel: true
          ci-build-id: ${{ github.run_id }}-${{ github.run_attempt }}
          group: 'GH Actions Linux'
          tag: ${{ github.event_name }},${{ github.ref_name }}
          install-command: npm ci
        env:
          PADHAI_REQUIRE_AUTH: '0'
          PADHAI_SKIP_DOTENV: '1'
          PADHAI_DB_PATH: /tmp/padhai_ci.db
          CYPRESS_RECORD_VIDEO: '1'
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ---------- Cypress: LOCAL variant ----------
      # When no record key is configured, just run all specs in one
      # container. NO ci-build-id / group / parallel flags — Cypress
      # rejects those without --record.
      - name: Cypress run (local only)
        if: env.HAS_RECORD_KEY != 'yes'
        uses: cypress-io/github-action@v7
        with:
          start: python -m uvicorn padhai.web:app --host 0.0.0.0 --port 8000 --log-level warning
          wait-on: 'http://127.0.0.1:8000/healthz'
          wait-on-timeout: 180
          install-command: npm ci
        env:
          PADHAI_REQUIRE_AUTH: '0'
          PADHAI_SKIP_DOTENV: '1'
          PADHAI_DB_PATH: /tmp/padhai_ci.db
          CYPRESS_RECORD_VIDEO: '1'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ---------- Always-uploaded debug artefacts ----------
      - name: Upload Cypress screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots-${{ matrix.containers }}
          path: cypress/screenshots
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Cypress videos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-videos-${{ matrix.containers }}
          path: cypress/videos
          if-no-files-found: ignore
          retention-days: 7
