[tool.ruff]
# Match the conventions in the existing codebase.
line-length = 100
target-version = "py311"
exclude = [
    "padhai/__pycache__",
    ".venv",
    "venv",
    "build",
    "dist",
    "node_modules",
    "cypress/videos",
    "cypress/screenshots",
]

[tool.ruff.lint]
# Phased rollout. Each category becomes blocking once its noise
# floor is near zero. Current scope:
#   • F — pyflakes (undefined names, broken format strings) — clean
#   • E — pycodestyle errors — clean
#   • I — isort (import sorting + grouping) — clean
#   • B — bugbear (likely-bug patterns) — clean ex B008
#   • UP — pyupgrade (modern syntax) — clean after one-shot --fix
#   • SIM — simplify (readability) — clean after one-shot --fix
#     (16 auto-fixes applied; 13 sites carry `# noqa: SIMxxx` for
#     intentional structure — see e.g. padhai/auth.py:243 where a
#     try-pass deliberately preserves a "column already exists" hint)
#   • RUF — Ruff-specific lints. 200 auto-fixed (RUF100/RUF102/RUF021);
#     104 unicode-ambiguous sites (RUF001/2/3) are codebase-ignored
#     because em-dashes and Devanagari are intentional in the Indian-
#     language UI text + bench data; 35 small judgment-call sites
#     carry targeted `# noqa: RUFxxx` markers.
#   • ARG — unused arguments. 69 sites carry `# noqa: ARG00x` after a
#     `--add-noqa` pass: most are polymorphic provider dispatchers
#     (push.py, talking_head.py, diagrams.py) where each provider
#     implements the same shape but uses different params, and
#     FastAPI's `Depends()` pattern where the dependency is the goal,
#     not the param itself.
# Still advisory (pre-commit only):
#   • PL — pylint (2538 findings, mostly PLC0415 late-imports which we
#     use intentionally to break import cycles).
#   • C90 — complexity caps (codebase has legacy hotspots).
#   • T20 — `print` calls (569 findings, mostly intentional debug logs
#     in scripts/ and ops surfaces).
# When you touch a file, ruff --fix will quietly clean it. Promote
# the next category to blocking once `ruff check --select <X>`
# shows zero findings.
select = ["F", "E", "I", "B", "UP", "SIM", "RUF", "ARG"]

# Deliberate ignores:
ignore = [
    "F401",  # unused-import — many modules import-for-side-effects
             # (migrate() registration). False positive cost > value.
    "F841",  # unused-local-variable — codebase has many `x = call()`
             # patterns where the assignment is intentional for the
             # repr in a debugger or the result of a side-effecting
             # call. Worth fixing case-by-case, not as a CI block.
    "E501",  # line-too-long — codebase has many intentionally-long
             # URLs, SQL, prompt strings. Add `# noqa: E501` on
             # specific lines that genuinely should be split.
    "E741",  # ambiguous-variable-name — `l`, `I` etc are sometimes
             # intentional (`for l in lines`, `I` for identity matrix).
    "E402",  # module-import-not-at-top — some scripts intentionally
             # set os.environ BEFORE importing padhai modules.
    "E701",  # multiple-statements-on-line-with-colon — `if x: return`
             # is widely used and idiomatic in this codebase.
    "E702",  # multiple-statements-on-line-with-semicolon — compact
             # SQL builders use `sql += "..."; params.append(...)` to
             # keep the SQL + params adjacent. Splitting hurts
             # readability.
    "E401",  # multiple-imports-on-one-line — `import a, b` is fine
             # for stdlib siblings.
    "B008",  # function-call-in-default-argument — FastAPI's
             # `Depends(get_x)` is THE idiom. Codebase has 530
             # legitimate uses across every router.
    # B904 was once 344 sites; cleaned by an AST-based mass fixer
    # (scripts/fix_b904.py) and is now blocking — re-introductions
    # are caught at PR time.
    "RUF001",  # ambiguous-unicode-character-string — codebase has
               # em-dashes (—), smart quotes (', '), and Devanagari
               # ("मुख्यमंत्री") in Indian-language UI strings and
               # bench answers. These are intentional, not typos.
    "RUF002",  # same, in docstrings.
    "RUF003",  # same, in comments.
]

[tool.ruff.lint.per-file-ignores]
# Test files commonly use fixtures + assertions that ruff flags
"tests/**" = ["B011", "F401"]
"scripts/qa_*.py" = ["F401"]
# admin's templates have intentional long format strings
"admin/templates.py" = ["E501", "UP032"]
