# Dev E2E stack — `make e2e` brings this up.
#
# Services:
#   postgres  — primary store
#   minio     — S3-compatible object storage for rendered MP4s
#   liquibase — one-shot, runs db/changesets against postgres at boot
#   app       — FastAPI uvicorn (with hot-reload)
#
# Run:
#   docker-compose up -d              # start
#   make seed                          # populate demo accounts
#   curl http://localhost:8000/healthz # sanity
#   docker-compose down -v             # stop + wipe volumes
#
# Env file: docker-compose reads .env from the working directory.
# Use .env.docker.example as a template; commit nothing with real
# secrets in it.

version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: padhai
      POSTGRES_PASSWORD: padhai
      POSTGRES_DB: padhai
    ports:
      - "5432:5432"
    volumes:
      - padhai_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U padhai -d padhai"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - padhai_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Create the dev bucket on first run. One-shot — exits when done.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      (mc mb local/padhai-dev || true) &&
      mc anonymous set public local/padhai-dev &&
      echo 'bucket padhai-dev ready'
      "

  liquibase:
    # prod-182: was liquibase/liquibase:4-alpine — that floating tag was
    # removed from Docker Hub and broke `docker compose up` (image not
    # found -> the app waits on liquibase and never starts). Pinned to a
    # real, current alpine release for reproducible local + CI runs.
    image: liquibase/liquibase:4.31-alpine
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./db/changesets:/liquibase/changelog
    # master.xml composes every formatted-SQL file in order so adding
    # a new changeset only needs one <include> entry, not a compose
    # edit. See db/changesets/master.xml.
    #
    # prod-182: liquibase 4.31 no longer auto-adds the working dir to
    # its changelog search path (the old 4-alpine did), so master.xml
    # was "not found". --searchPath points it at the mounted changelog
    # volume explicitly.
    command: >
      --searchPath=/liquibase/changelog
      --url=jdbc:postgresql://postgres:5432/padhai
      --username=padhai
      --password=padhai
      --changeLogFile=master.xml
      update

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      liquibase:
        condition: service_completed_successfully
    environment:
      # Postgres — uses search_path=public per CLAUDE.md §10.
      # `users` + `jobs` tables live here; everything else lands in
      # the shared SQLite file at $PADHAI_DB_PATH (next line).
      DATABASE_URL: postgresql://padhai:padhai@postgres:5432/padhai
      # The 70+ modules that haven't been ported to Postgres write
      # their tables to this SQLite file. Pinned to a named-volume
      # path so re-running compose doesn't wipe accumulated state
      # (citations, llm_calls, exam_pack_enrollments, etc.). Without
      # this, the modules would default to /root/.padhai/jobs.db
      # which lives in ephemeral container scratch space.
      # prod-182: SQLite module DB lives in /app/dbstore (named volume),
      # NOT /app/data — because /app/data is now a read-only bind mount
      # of the repo's static seed content (data/pyq/*.json etc.) so the
      # in-container seeder (scripts.seed_all_content) can import PYQs.
      PADHAI_DB_PATH: /app/dbstore/jobs.db
      # JWT + admin
      PADHAI_JWT_SECRET: ${PADHAI_JWT_SECRET:-dev-jwt-secret-not-for-prod-change-me-please-32chars-at-least}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:-dev-admin-secret-not-for-prod-change-me-please-32chars}
      ADMIN_BOOTSTRAP_TOKEN: ${ADMIN_BOOTSTRAP_TOKEN:-dev-bootstrap-token-replace-me}
      ADMIN_DB_PATH: /app/dbstore/admin.db
      # Dev affordances
      PADHAI_REQUIRE_AUTH: "0"
      APP_ENV: development
      PADHAI_SKIP_DOTENV: "1"
      # AI features — leave unset to exercise heuristic fallbacks
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Object storage → MinIO
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: padhai-dev
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      # Razorpay sandbox (optional — leave unset to skip payments E2E)
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
    ports:
      - "8000:8000"
    volumes:
      # Source mount → hot-reload
      - ./padhai:/app/padhai
      - ./admin:/app/admin
      - ./scripts:/app/scripts
      - ./tests:/app/tests
      - ./cypress:/app/cypress
      # prod-182: repo static seed content (PYQ JSONs, concept-video
      # seeds, golden answers) mounted read-only so the in-container
      # seeder can import them. Read-only — the container never mutates
      # the host repo's data/.
      - ./data:/app/data:ro
      # Persistent SQLite + admin DB + output cache so module tables
      # (citations, llm_calls, etc.) survive container rebuilds. Moved
      # off /app/data (now the read-only repo bind above) to /app/dbstore.
      - padhai_app_data:/app/dbstore
      - padhai_output:/var/padhai/cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

volumes:
  padhai_pg_data:
  padhai_minio_data:
  padhai_app_data:    # SQLite + admin.db
  padhai_output:      # rendered MP4 cache
